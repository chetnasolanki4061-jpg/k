<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sorry Kuldeep ❤</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      color: #d60000;
      margin-bottom: 20px;
    }

    .sorry {
      font-size: 22px;
      margin: 4px;
    }

    /* ❤ Heart animation */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 26px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-100vh) scale(1.6);
        opacity: 0;
      }
    }

    /* 😭 Popup */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      max-width: 300px;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .popup-box h2 {
      color: #d60000;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #e6003e;
    }
  </style>
</head>
<body>

<h1>😔 Sorry Kuldeep ❤</h1>

<div id="sorryBox"></div>

<!-- Popup -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h2>🥺 Kuldeep…</h2>
    <p>Please maani jaa na… 😭❤</p>
    <button onclick="closePopup()">Maani Gayo ❤</button>
  </div>
</div>

<script>
  // 100 Sorry Kuldeep
  const box = document.getElementById("sorryBox");
  for (let i = 1; i <= 100; i++) {
    const div = document.createElement("div");
    div.className = "sorry";
    div.innerText = i + ". Sorry Kuldeep ❤";
    box.appendChild(div);
  }

  // Floating hearts
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }
  setInterval(createHeart, 300);

  // Show popup after 5 seconds
  setTimeout(() => {
    document.getElementById("popup").style.display = "flex";
  }, 5000);

  function closePopup() {
    document.getElementById("popup").style.display = "none";
  }
</script>

</body>
</html>
